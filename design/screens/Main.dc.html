<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>맘마 홈 · 오늘의 식단</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=Jua&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#92400E}a:hover{color:#78350F}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFBF5; font-family: 'IBM Plex Sans KR', sans-serif; color: #2B2118; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <header style="padding: 20px 20px 12px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 40px; height: 40px; border-radius: 14px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B2118" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11h18a9 9 0 0 1-18 0z"></path><path d="M12 2v5"></path><path d="M8 4l1.5 3"></path><path d="M16 4l-1.5 3"></path></svg>
      </div>
      <span style="font-family: 'Jua', sans-serif; font-size: 26px; letter-spacing: -0.5px">맘마</span>
    </div>
    <button aria-label="알림" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #EFE4D6; background: #FFFFFF; display: flex; align-items: center; justify-content: center; position: relative">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B2118" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      <span style="position: absolute; top: 9px; right: 10px; width: 9px; height: 9px; border-radius: 5px; background: #DC2626; border: 2px solid #FFFFFF"></span>
    </button>
  </header>

  <div style="flex: 1; overflow-y: auto; padding: 4px 20px 110px; display: flex; flex-direction: column; gap: 16px">

    <section style="background: {{accentSoft}}; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <div style="display: flex; align-items: center; gap: 12px">
          <div style="width: 52px; height: 52px; border-radius: 26px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Jua', sans-serif; font-size: 22px; color: {{accentInk}}">하</div>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 17px; font-weight: 700">하은이</span>
            <span style="font-size: 13px; color: #5C4A3A">2026.03.17 출생 · 중기 이유식</span>
          </div>
        </div>
        <button style="height: 44px; padding: 0 14px; border-radius: 22px; border: none; background: #FFFFFF; font-size: 13px; font-weight: 600; color: {{accentInk}}">프로필 수정</button>
      </div>
      <div style="display: flex; align-items: flex-end; justify-content: space-between">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 13px; color: #5C4A3A">오늘은 생후</span>
          <span style="font-family: 'Jua', sans-serif; font-size: 44px; line-height: 1; color: {{accentInk}}">D+224<span style="font-size: 22px">일차</span></span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
          <span style="font-size: 12px; color: #5C4A3A">1회 목표 80ml · 하루 2회</span>
          <span style="font-size: 12px; font-weight: 600; color: #2B2118; background: #FFFFFF; padding: 4px 10px; border-radius: 10px">7~9개월 · 묽은 죽</span>
        </div>
      </div>
    </section>

    <section role="alert" style="background: #FEF2F2; border: 1px solid #FECACA; border-radius: 18px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B91C1C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 14px; font-weight: 700; color: #991B1B">3일 안에 써야 할 큐브 2개</span>
        <span style="font-size: 13px; color: #7F1D1D">소고기 큐브 D-2 · 브로콜리 큐브 D-1</span>
      </div>
      <a href="Cube.dc.html" style="font-size: 13px; font-weight: 600; color: #991B1B; padding: 2px 0; text-decoration: underline">보관함</a>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 style="margin: 0; font-size: 18px; font-weight: 700">오늘의 식단</h2>
        <span style="font-size: 13px; color: #6B5A4A">{{doneCount}} / 2 완료</span>
      </div>
      <sc-for list="{{meals}}" as="meal" hint-placeholder-count="2">
        <article style="background: {{meal.bg}}; border: 1.5px solid {{meal.border}}; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; align-items: center; justify-content: space-between">
            <div style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 12px; font-weight: 600; color: #6B5A4A">{{meal.time}}</span>
              <span style="font-size: 16px; font-weight: 700">{{meal.title}}</span>
            </div>
            <button onClick="{{meal.toggle}}" aria-pressed="{{meal.done}}" style="height: 44px; min-width: 88px; padding: 0 14px; border-radius: 22px; border: 1.5px solid {{meal.border}}; background: {{meal.btnBg}}; color: {{meal.btnInk}}; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px">
              <sc-if value="{{meal.done}}" hint-placeholder-val="{{ false }}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
              </sc-if>
              {{meal.label}}
            </button>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{meal.items}}" as="it" hint-placeholder-count="4">
              <span style="display: flex; align-items: center; gap: 5px; font-size: 13px; padding: 4px 10px 4px 5px; border-radius: 10px; background: #FFFFFF; border: 1px solid #EFE4D6; color: #2B2118"><img src="{{it.src}}" alt="" style="width: 22px; height: 22px">{{it.v}}</span>
            </sc-for>
          </div>
          <sc-if value="{{meal.allergen}}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #6B21A8; background: #F3E8FF; padding: 6px 10px; border-radius: 10px">
              <img src="../icons/yolk.svg" alt="" style="width: 22px; height: 22px">
              알레르기 테스트 · {{meal.allergen}}
            </div>
          </sc-if>
        </article>
      </sc-for>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #EFE4D6; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700">이번 주 영양 균형</h2>
        <a href="Planner.dc.html" style="font-size: 13px; font-weight: 600; color: {{accentInk}}">주간 식단</a>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; font-size: 13px"><span>철분(소고기) 공급</span><span style="font-weight: 700">5 / 7일</span></div>
        <div style="height: 8px; border-radius: 4px; background: #F3EBE0; overflow: hidden"><div style="width: 71%; height: 100%; border-radius: 4px; background: {{accent}}"></div></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; font-size: 13px"><span>계란노른자 3일 테스트</span><span style="font-weight: 700">2 / 3일</span></div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
          <div style="height: 8px; border-radius: 4px; background: #7E22CE"></div>
          <div style="height: 8px; border-radius: 4px; background: #7E22CE"></div>
          <div style="height: 8px; border-radius: 4px; background: #F3EBE0"></div>
        </div>
      </div>
    </section>
  </div>

  <nav aria-label="하단 메뉴" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 12px 20px; background: #FFFFFF; border-top: 1px solid #EFE4D6; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{accentInk}}; font-size: 11px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>홈</a>
    <a href="Planner.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #6B5A4A; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>식단</a>
    <a href="Cube.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #6B5A4A; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg>홈큐브</a>
    <a href="Report.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #6B5A4A; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>성장 리포트</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Warm Amber","Soft Blue","Nature Green"],"default":"Warm Amber"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: { 0: true, 1: false } };
  }
  renderVals() {
    const themes = {
      'Warm Amber': { accent: '#F59E0B', accentSoft: '#FEF3C7', accentInk: '#92400E' },
      'Soft Blue': { accent: '#3B82F6', accentSoft: '#DBEAFE', accentInk: '#1E40AF' },
      'Nature Green': { accent: '#10B981', accentSoft: '#D1FAE5', accentInk: '#065F46' }
    };
    const t = themes[this.props.theme ?? 'Warm Amber'] || themes['Warm Amber'];
    const I = {
      '쌀': '../icons/rice.svg',
      '소고기': '../icons/beef.svg',
      '애호박': '../icons/zucchini.svg',
      '양파': '../icons/onion.svg',
      '브로콜리': '../icons/broccoli.svg',
      '배': '../icons/pear.svg'
    };
    const mk = (names) => names.map((v) => ({ v, src: I[v] }));
    const base = [
      { time: '오전 10:00 · 아침', title: '소고기 · 애호박 · 양파', items: mk(['쌀', '소고기', '애호박', '양파']), allergen: '' },
      { time: '오후 5:30 · 저녁', title: '소고기 · 브로콜리 · 배', items: mk(['쌀', '소고기', '브로콜리', '배']), allergen: '계란노른자 2일차' }
    ];
    let doneCount = 0;
    const meals = base.map((m, i) => {
      const done = !!this.state.done[i];
      if (done) doneCount++;
      return {
        ...m,
        done,
        label: done ? '완료' : '예정',
        bg: done ? '#F0FDF4' : '#FFFFFF',
        border: done ? '#16A34A' : '#EFE4D6',
        btnBg: done ? '#15803D' : '#FFFFFF',
        btnInk: done ? '#FFFFFF' : '#2B2118',
        toggle: () => this.setState({ done: { ...this.state.done, [i]: !done } })
      };
    });
    return { ...t, meals, doneCount };
  }
}
</script>
</body>
</html>
